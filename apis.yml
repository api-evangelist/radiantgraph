name: RadiantGraph
description: 'RadiantGraph is a healthcare engagement platform that turns fragmented health data into
  personalized member connections to improve clinical outcomes and reduce wasted spend. Its "Intelligent
  Personalization" product suite includes a Health Data Engine that ingests and enriches member records
  with 80+ social determinants of health, Smart Cohorts for identifying high-risk member groups, and Smart
  Spend for scoring members on clinical risk. The platform integrates with CRMs, contact centers, campaign
  engines, portals, and care-management systems, connecting claims data warehouses, clinical data repositories,
  and member-demographics sources. Backed by True Ventures. No public developer platform, API documentation,
  or SDKs were found at the time of enrichment.'
